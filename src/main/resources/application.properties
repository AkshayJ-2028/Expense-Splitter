spring.application.name=expensesplitter
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/expensesplitter}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:expense-splitter-local-secret-key-change-this-to-a-long-random-string-123456}
app.jwt.expiration-ms=86400000